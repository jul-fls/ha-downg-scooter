name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Tests and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install type-check dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip install --no-deps homeassistant==2026.2.3
      - name: Run strict type check
        run: .venv/bin/pyright
      - name: Check manifest version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: .venv/bin/python scripts/check_version.py
      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
